<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>电梯公寓大逃杀 v5</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>电梯公寓<span>大逃杀</span><em id="ver">v5</em><button id="btnHelp" class="mini" title="玩法 / 教程">?</button></h1>

    <section class="grp">
      <label class="row">模式
        <select id="modeSel">
          <option value="escape">逃生（我当小孩）</option>
          <option value="hunt">猎杀（我当杀人犯）</option>
          <option value="spectate">观战（全 AI）</option>
        </select>
      </label>
      <label class="row">视角
        <select id="viewSel">
          <option value="fog">有限视角</option>
          <option value="god">上帝视角</option>
        </select>
      </label>
    </section>

    <section class="grp">
      <div class="lbl">局面</div>
      <label class="row">小孩 <input id="kidsNum" type="number" min="1" max="8" value="3" /></label>
      <label class="row">杀人犯 <input id="killersNum" type="number" min="1" max="6" value="2" /></label>
      <label class="row">时长（秒）<input id="roundNum" type="number" min="30" max="900" step="10" value="180" /></label>
      <label class="row">模拟倍速
        <select id="speedSel">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
    </section>

    <section class="grp">
      <div class="lbl">电梯</div>
      <label class="row">层间秒<input id="pSecFloor" type="range" min="1" max="6" step="0.1" value="2" /><b id="vSecFloor">2</b></label>
      <label class="row">开门<input id="pDoorOpen" type="range" min="0.5" max="4" step="0.1" value="1.5" /><b id="vDoorOpen">1.5</b></label>
      <label class="row">保持<input id="pDoorHold" type="range" min="0.5" max="6" step="0.1" value="3" /><b id="vDoorHold">3</b></label>
      <label class="row">关门<input id="pDoorClose" type="range" min="0.5" max="4" step="0.1" value="1.5" /><b id="vDoorClose">1.5</b></label>
      <label class="row">楼道长<input id="pCorridor" type="range" min="0" max="16" step="0.5" value="9.5" /><b id="vCorridor">9.5</b></label>
      <div class="col"><span>呼梯按钮</span>
        <span class="toggle" id="hallToggle" title="点亮=公用一套（群控派梯）；熄灭=每部梯一套（各按各的）">
          <i id="hallDot" class="dot on"></i><b id="hallModeText">公用一套</b>
        </span>
      </div>
    </section>

    <section class="grp">
      <div class="lbl">角色</div>
      <label class="row">小孩速<input id="pKidSpeed" type="range" min="1" max="4" step="0.05" value="2.2" /><b id="vKidSpeed">2.2</b></label>
      <label class="row">小孩爬楼<input id="pKidStair" type="range" min="0.05" max="0.6" step="0.01" value="0.22" /><b id="vKidStair">0.22</b></label>
      <label class="row">杀人犯速<input id="pKillerSpeed" type="range" min="1" max="5" step="0.05" value="2.75" /><b id="vKillerSpeed">2.75</b></label>
      <label class="row">杀人犯爬楼<input id="pKillerStair" type="range" min="0.05" max="0.6" step="0.01" value="0.26" /><b id="vKillerStair">0.26</b></label>
      <label class="row">视距<input id="pVision" type="range" min="4" max="24" step="1" value="14" /><b id="vVision">14</b></label>
      <label class="row">小孩反应<input id="pReaction" type="range" min="0" max="0.8" step="0.05" value="0.25" /><b id="vReaction">0.25</b></label>
      <label class="row">抓捕耗时<input id="pGrip" type="range" min="0" max="2" step="0.05" value="0.4" /><b id="vGrip">0.4</b></label>
      <label class="row">情报寿命<input id="pChannel" type="range" min="1" max="20" step="1" value="6" /><b id="vChannel">6</b></label>
    </section>

    <section class="grp btns">
      <button id="btnStart" class="primary">开始</button>
      <button id="btnPause">暂停</button>
      <button id="btnReset">重开</button>
    </section>

    <div class="hint">
      <div><kbd>A</kbd><kbd>D</kbd> 左右移动</div>
      <div><kbd>W</kbd><kbd>S</kbd> 楼梯口上下楼（楼梯上按反方向可掉头）</div>
      <div><kbd>Q</kbd><kbd>E</kbd> 电梯厅按 ▼/▲；轿厢里开/关门</div>
      <div><kbd>空格</kbd> 按身边的按钮 / 进出电梯</div>
      <div>鼠标点墙上的 ▲▼ 和轿厢面板也行</div>
      <div><kbd>P</kbd> 暂停</div>
    </div>
  </aside>

  <main id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="overlay" class="hidden">
      <div id="overlayCard"></div>
    </div>
  </main>

  <aside id="hud">
    <div class="timer"><span id="clock">03:00</span><small>剩余</small></div>
    <div class="statline"><span>存活 <b id="aliveKids">3</b></span><span>被抓 <b id="caught">0</b></span></div>
    <div class="youbox" id="youStatus">—</div>
    <div class="board">
      <div class="lbl">电梯</div>
      <div id="elevBoard"></div>
    </div>
    <div class="board">
      <div class="lbl">分数</div>
      <div id="scoreList"></div>
    </div>
    <div class="logbox">
      <div class="lbl">事件</div>
      <div id="log"></div>
    </div>
  </aside>
</div>

<!-- 进入游戏时的简介 / 教程（可跳过） -->
<div id="intro" class="hidden">
  <div class="introCard">
    <div class="introHead">
      <span class="ver" id="introVer">v5</span>
      <h2>电梯公寓大逃杀</h2>
      <div class="dots" id="introDots"></div>
    </div>
    <div class="introBody" id="introBody"></div>
    <div class="introFoot">
      <button id="introSkip" class="ghost">跳过教程</button>
      <span class="spacer"></span>
      <button id="introPrev" class="ghost">上一页</button>
      <button id="introNext" class="primary">下一页</button>
    </div>
  </div>
</div>

<script src="src/config.js"></script>
<script src="src/model/building.js"></script>
<script src="src/model/elevator.js"></script>
<script src="src/sim/perception.js"></script>
<script src="src/sim/nav.js"></script>
<script src="src/sim/world.js"></script>
<script src="src/sim/ai.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/ui/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
